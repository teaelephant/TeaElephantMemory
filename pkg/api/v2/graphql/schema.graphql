scalar Date

type Query {
    me: User
    "Verified administrator capabilities for the versioned catalogue protocol."
    editorCapabilities: EditorCapabilities!
    "Committed catalogue operation receipt; verified administrator authorization required."
    editorOperationReceipt(idempotencyKey: String!): CatalogueOperationReceipt
    "Preview one administrative Tea merge. A matching preview must be supplied at commit. Counts expose no user identities."
    previewTeaMerge(sourceTeaID: ID!, targetTeaID: ID!): TeaMergePreview!
    "Recover historical merge counters and receipt without repeating a write; verified administrator authorization required."
    editorTeaMergeReceipt(sourceTeaID: ID!, targetTeaID: ID!, expectedSourceRevision: String!, expectedTargetRevision: String!, previewToken: String!, idempotencyKey: String!): TeaMergeResult
    "Get information about teas."
    teas(prefix: String): [Tea!]!
    "Get information about tea by id."
    tea(id: ID!): Tea
    "Generate description for tea with ai."
    generateDescription(name: String!): String!
    "Get tea meta information by qr code"
    qrRecord(id: ID!): QRRecord
    "Get tag by id."
    tag(id: ID!): Tag
    "Get categories of tags"
    tagsCategories(name: String): [TagCategory!]!
    "Collection of teas, authorization required"
    collections: [Collection!]!
    "Get tea of the day"
    teaOfTheDay: TeaOfTheDay
}

type Mutation {
    authApple(appleCode:String!, deviceID: ID!): Session!
    "Create a new shared catalogue entry and its initial existing tags atomically with a fresh ID; user or administrator authorization required. Existing entries are not overwritten. Omitted tagIDs defaults to no tags."
    newTea(tea: TeaData!, tagIDs: [ID!]! = [], idempotencyKey: String): Tea!
    "Update shared catalogue metadata; administrator authorization required."
    updateTea(id: ID!, tea: TeaData!, expectedRevision: String): Tea!
    "Assign a shared catalogue tag; administrator authorization required."
    addTagToTea(teaID: ID!, tagID: ID!, expectedRevision: String): Tea!
    "Remove a shared catalogue tag assignment; administrator authorization required."
    deleteTagFromTea(teaID: ID!, tagID: ID!, expectedRevision: String): Tea!
    "Delete a shared catalogue entry; administrator authorization required."
    deleteTea(id: ID!, expectedRevision: String): ID!
    "Merge one duplicate Tea into another atomically; verified administrator authorization required. Keep the exact original arguments and idempotencyKey on retries."
    mergeTeas(sourceTeaID: ID!, targetTeaID: ID!, expectedSourceRevision: String!, expectedTargetRevision: String!, previewToken: String!, idempotencyKey: String!): TeaMergeResult!
    "Attach a JPEG or PNG to the shared tea catalogue entry; authorization required."
    addTeaImage(teaID: ID!, imageBase64: String!, expectedRevision: String, idempotencyKey: String): Tea!
    "Remove an image from the shared tea catalogue; administrator authorization required."
    deleteTeaImage(teaID: ID!, imageID: ID!, expectedRevision: String): Tea!
    "Choose the catalogue cover image; authorization required."
    setTeaCoverImage(teaID: ID!, imageID: ID!, expectedRevision: String): Tea!
    "Create or update jar metadata; user or administrator authorization required. QR IDs remain shared, without exclusive ownership."
    writeToQR(id: ID!, data: QRRecordData!): QRRecord!
    "Create a shared tag category; administrator authorization required."
    createTagCategory(name: String!): TagCategory!
    "Update a shared tag category; administrator authorization required."
    updateTagCategory(id: ID!, name: String!, expectedRevision: String): TagCategory!
    "Delete a shared tag category; administrator authorization required."
    deleteTagCategory(id:ID!, expectedRevision: String): ID!
    "Create a shared tag; administrator authorization required."
    createTag(name: String!, color: String!, category: ID!): Tag!
    "Update a shared tag; administrator authorization required."
    updateTag(id: ID!, name: String!, color: String!, expectedRevision: String): Tag!
    "Change a shared tag category; administrator authorization required."
    changeTagCategory(id: ID!, category: ID!, expectedRevision: String): Tag!
    "Delete a shared tag; administrator authorization required."
    deleteTag(id: ID!, expectedRevision: String): ID!
    "authorization required"
    createCollection(name: String!): Collection!
    "authorization required"
    addRecordsToCollection(id: ID!, records: [ID!]!): Collection!
    "authorization required"
    deleteRecordsFromCollection(id: ID!, records: [ID!]!): Collection!
    "authorization required"
    deleteCollection(id: ID!): ID!
    "Register a notification token for a device already bound to the authenticated user; administrator credentials do not replace that user session."
    registerDeviceToken(deviceID: ID!, deviceToken: String!): Boolean!
    send: Boolean!
    "get tea recommendation"
    teaRecommendation(collectionID: ID!, feelings: String!): String!
}

type TeaOfTheDay {
    tea: QRRecord!
    date: Date!
}

type Subscription {
    "Subscription for tea addition."
    onCreateTea: Tea!
    "Subscription for tea update."
    onUpdateTea: Tea!
    "Subscription for tea remove."
    onDeleteTea: ID!
    "Subscription for tag category addition."
    onCreateTagCategory: TagCategory!
    "Subscription for tag category update."
    onUpdateTagCategory: TagCategory!
    "Subscription for tag category remove."
    onDeleteTagCategory: ID!
    "Subscription for tag category addition."
    onCreateTag: Tag!
    "Subscription for tag update."
    onUpdateTag: Tag!
    "Subscription for tag remove."
    onDeleteTag: ID!
    "Subscription for tag addition to tea."
    onAddTagToTea: Tea!
    "Subscription for tag deletion from tea."
    onDeleteTagFromTea: Tea!
    "Async generate description for tea with ai."
    startGenerateDescription(name: String!): String!
    "Async get tea recommendation"
    recommendTea(collectionID: ID!, feelings: String!): String!
}

type TagCategory {
    "Opaque version of this catalogue entity. Echo as expectedRevision on edits."
    revision: String!
    id: ID!
    name: String!
    tags(name: String): [Tag!]!
}

type QRRecord {
    id: ID!
    tea: Tea!
    bowlingTemp: Int!
    expirationDate: Date!
}

input QRRecordData {
    tea: ID!
    bowlingTemp: Int!
    expirationDate: Date!
}

type Tea {
    "Opaque version of this catalogue entity. Echo as expectedRevision on edits."
    revision: String!
    id: ID!
    name: String!
    type: Type!
    description: String!
    tags: [Tag!]!
    images: [TeaImage!]!
}

type TeaImage {
    id: ID!
    "Path relative to the API origin."
    url: String!
    contentType: String!
    width: Int!
    height: Int!
    createdAt: Date!
    isCover: Boolean!
}

input TeaData {
    name: String!
    type: Type!
    description: String!
}

type Tag {
    "Opaque version of this catalogue entity. Echo as expectedRevision on edits."
    revision: String!
    id: ID!
    name: String!
    color: String!
    category: TagCategory!
}

enum Type {
    unknown
    tea
    coffee
    herb
    other
}

type Collection {
    id: ID!
    name: String!
    userID: ID!
    records: [QRRecord!]!
}

type Session {
    token: String!
    expiredAt: Date!
}

type User {
    tokenExpiredAt: Date!
    collections: [Collection!]!
    notifications: [Notification!]!
}

type Notification {
    type: NotificationType!
}

enum NotificationType {
    unknown
    teaExpiration
    teaRecommendation
}


type EditorCapabilities {
    protocolVersion: String!
    supportsRevisions: Boolean!
    supportsIdempotency: Boolean!
    supportsTeaMerge: Boolean!
}

type TeaMergePreview {
    sourceTea: Tea!
    targetTea: Tea!
    previewToken: String!
    qrCount: Int!
    collectionMembershipCount: Int!
    tagsToAdd: Int!
    imagesToMove: Int!
    consumptionCount: Int!
    resultingImageCount: Int!
    blockers: [String!]!
    metadataPolicy: String!
    coverPolicy: String!
    "Resulting cover UUID; target cover, otherwise source cover, otherwise the oldest surviving image. Null for an empty gallery."
    resultingCoverImageID: ID
}

type TeaMergeResult {
    receipt: CatalogueOperationReceipt!
    "Current target, or null if later deleted. The receipt always describes the original committed operation."
    targetTea: Tea
    replayed: Boolean!
    sourceTeaID: ID!
    targetTeaID: ID!
    qrCount: Int!
    collectionMembershipCount: Int!
    tagsAdded: Int!
    imagesMoved: Int!
    consumptionsMoved: Int!
}

type CatalogueOperationReceipt {
    idempotencyKey: String!
    operation: String!
    teaID: ID!
    resourceID: ID!
    resultRevision: String!
    completedAt: Date!
}
